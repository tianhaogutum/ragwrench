<text class="title" x="441.0" y="20.0" text-anchor="middle">examples/audit  —  synthetic chunk export, offline</text>
<text y="59" xml:space="preserve"><tspan x="18.0" class="b c32">$</tspan><tspan x="33.7" class="b">ragwrench audit chunks.jsonl --source handbook.md</tspan></text>
<text y="76" xml:space="preserve"><tspan x="18.0" class="b">ragwrench audit</tspan><tspan x="151.1">chunks.jsonl</tspan></text>
<text y="93" xml:space="preserve"><tspan x="33.7" class="d">12 chunks · 1,502 characters · source handbook.md (93.5% covered)</tspan></text>
<text y="127" xml:space="preserve"><tspan x="18.0" class="b">Findings</tspan><tspan x="292.1" class="d">rule</tspan><tspan x="346.9" class="d">found</tspan><tspan x="401.7" class="d">auto-fix</tspan><tspan x="480.0" class="d">why it hurts retrieval</tspan></text>
<text y="144" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3">Broken code fences</tspan><tspan x="292.1">CL001</tspan><tspan x="378.2" class="c31">2</tspan><tspan x="456.5">2</tspan><tspan x="480.0" class="d">half a code block is retrieved</tspan></text>
<text y="161" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Table rows without a header</tspan><tspan x="292.1">CL002</tspan><tspan x="378.2" class="c33">2</tspan><tspan x="456.5">2</tspan><tspan x="480.0" class="d">cells are retrieved without column names</tspan></text>
<text y="178" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Orphan headings</tspan><tspan x="292.1">CL003</tspan><tspan x="378.2" class="c33">1</tspan><tspan x="456.5">1</tspan><tspan x="480.0" class="d">a heading is cut off from its text</tspan></text>
<text y="195" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Mid-sentence cuts</tspan><tspan x="292.1">CL004</tspan><tspan x="378.2" class="c33">1</tspan><tspan x="456.5" class="d">-</tspan><tspan x="480.0" class="d">a sentence is split across chunks</tspan></text>
<text y="212" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Size outliers</tspan><tspan x="292.1">CL005</tspan><tspan x="378.2" class="c33">1</tspan><tspan x="456.5">1</tspan><tspan x="480.0" class="d">too small to mean anything, or too big to embed</tspan></text>
<text y="229" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Duplicates and heavy overlap</tspan><tspan x="292.1">CL006</tspan><tspan x="378.2" class="c33">2</tspan><tspan x="456.5">2</tspan><tspan x="480.0" class="d">the same text crowds the top-k</tspan></text>
<text y="246" xml:space="preserve"><tspan x="33.7" class="c31">✗</tspan><tspan x="49.3">Source coverage loss</tspan><tspan x="292.1">CL007</tspan><tspan x="378.2" class="c31">1</tspan><tspan x="456.5" class="d">-</tspan><tspan x="480.0" class="d">source text that no chunk contains</tspan></text>
<text y="263" xml:space="preserve"><tspan x="33.7" class="c33">!</tspan><tspan x="49.3">Split lists</tspan><tspan x="292.1">CL008</tspan><tspan x="378.2" class="c33">1</tspan><tspan x="456.5" class="d">-</tspan><tspan x="480.0" class="d">list items are cut across chunks</tspan></text>
<text y="297" xml:space="preserve"><tspan x="18.0" class="b">Worst chunks</tspan></text>
<text y="314" xml:space="preserve"><tspan x="33.7">lf-02</tspan><tspan x="174.6">CL001</tspan><tspan x="276.4" class="d">"## Install↵↵Install the command-line client, then point…"</tspan></text>
<text y="331" xml:space="preserve"><tspan x="33.7">lf-03</tspan><tspan x="174.6">CL001</tspan><tspan x="276.4" class="d">"lanternfish queues list↵```↵↵The installer writes its c…"</tspan></text>
<text y="348" xml:space="preserve"><tspan x="33.7">lf-06</tspan><tspan x="174.6">CL003 CL005</tspan><tspan x="276.4" class="d">"## Rotating API keys"</tspan></text>
<text y="365" xml:space="preserve"><tspan x="33.7">lf-12-reingested</tspan><tspan x="174.6">CL006</tspan><tspan x="276.4" class="d">"## Support↵↵Open a ticket from the dashboard. Include t…"</tspan></text>
<text y="382" xml:space="preserve"><tspan x="33.7">lf-05</tspan><tspan x="174.6">CL002</tspan><tspan x="276.4" class="d">"| Business | 3000 | 500 | billed |↵| Enterprise | 12000…"</tspan></text>
<text y="416" xml:space="preserve"><tspan x="18.0" class="b">Source text missing from every chunk</tspan></text>
<text y="433" xml:space="preserve"><tspan x="33.7" class="c31">handbook.md:48-50</tspan><tspan x="182.4" class="d">"## Webhooks↵↵Webhooks deliver each event at least once.…"</tspan></text>
<text y="467" xml:space="preserve"><tspan x="18.0" class="b">Top fixes</tspan></text>
<text y="484" xml:space="preserve"><tspan x="33.7">1. Repair in place (1 code block rejoined, 2 tables rejoined, 1 heading merged and 1 duplicate dropped)</tspan></text>
<text y="501" xml:space="preserve"><tspan x="57.1" class="d">resolves 8 of 11 findings (measured by a dry run); source coverage preserved</tspan></text>
<text y="518" xml:space="preserve"><tspan x="57.1" class="c36">ragwrench lint fix chunks.jsonl --source handbook.md -o chunks.fixed.jsonl</tspan></text>
<text y="535" xml:space="preserve"><tspan x="33.7">2. Re-ingest the source text no chunk contains (78 of 1,195 characters, 1 gap)</tspan></text>
<text y="552" xml:space="preserve"><tspan x="57.1" class="d">a loader or filter dropped it; gaps are listed above</tspan></text>
<text y="569" xml:space="preserve"><tspan x="57.1" class="c36">ragwrench lint check chunks.jsonl --source handbook.md --format json</tspan></text>
<text y="586" xml:space="preserve"><tspan x="33.7">3. Stop splitting tables: re-chunk so every table chunk repeats its header row (2 fragments without one)</tspan></text>
<text y="603" xml:space="preserve"><tspan x="57.1" class="d">table-aware chunks carry the heading path, caption and header row</tspan></text>
<text y="620" xml:space="preserve"><tspan x="57.1" class="c36">ragwrench table-chunk split handbook.md --max-tokens 256 -o chunks.tables.jsonl</tspan></text>
<text y="637" xml:space="preserve"><tspan x="33.7">4. 2 findings need a splitter change (mid-sentence cuts and split lists)</tspan></text>
<text y="654" xml:space="preserve"><tspan x="57.1" class="d">cut at paragraph and list boundaries; inspect each one by line</tspan></text>
<text y="671" xml:space="preserve"><tspan x="57.1" class="c36">ragwrench lint check chunks.jsonl --source handbook.md</tspan></text>
<text y="705" xml:space="preserve"><tspan x="18.0" class="c31">11 findings</tspan><tspan x="112.0">in 8 of 12 chunks: 3 errors, 8 warnings; 8 fixable automatically.</tspan></text>
<text y="722" xml:space="preserve"><tspan x="18.0">--fail-on error:</tspan><tspan x="151.1" class="c31">FAIL (exit 1)</tspan></text>
</svg>
