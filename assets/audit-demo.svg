<svg xmlns="http://www.w3.org/2000/svg" width="882" height="738" viewBox="0 0 882 738" role="img" aria-labelledby="t d">
<title id="t">ragwrench audit on the bundled synthetic chunk export</title>
<desc id="d">Terminal output of ragwrench audit on examples/audit: findings per category (broken code fences, header-less table fragments, orphan headings, mid-sentence cuts, duplicates, source coverage loss, split lists), the worst chunks, the missing source text, and the top fixes with their commands. Generated by assets/render_terminal.py.</desc>
<style>text{font-family:ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace;font-size:13px;fill:#d9dde3;white-space:pre}.b{font-weight:700;fill:#ffffff}.d{fill:#8a919c}.c31{fill:#ff7b72}.c32{fill:#7ee787}.c33{fill:#e3b341}.c34{fill:#79c0ff}.c35{fill:#d2a8ff}.c36{fill:#76d4e8}.title{font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;font-size:12px;fill:#8a919c}</style>
<rect x="0.5" y="0.5" width="881" height="737" rx="10" fill="#14171c" stroke="#3a404a"/>
<path d="M0.5 32 V10.5 a10 10 0 0 1 10 -10 H871.5 a10 10 0 0 1 10 10 V32 Z" fill="#1d2128"/>
<line x1="0.5" y1="32" x2="881.5" y2="32" stroke="#3a404a"/>
