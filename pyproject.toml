[build-system]
requires = ["hatchling>=1.27", "hatch-fancy-pypi-readme>=24.1"]
build-backend = "hatchling.build"

[project]
name = "ragwrench"
version = "0.1.0"
description = "Offline QA and plumbing for RAG pipelines: lint chunks, sync and migrate vector stores, check citations, gate retrieval regressions, highlight PDFs."
# README.md with repository-relative links rewritten for PyPI (see tool.hatch.metadata.hooks below).
dynamic = ["readme"]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY.md", "licenses/*"]
authors = [{ name = "tianhaogutum" }]
keywords = [
    "rag", "retrieval-augmented-generation", "llm", "chunking", "vector-database",
    "qdrant", "chroma", "bm25", "cjk", "hybrid-search", "citations",
    "retrieval-evaluation", "information-retrieval", "dify", "ragflow", "pdf",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: Chinese (Simplified)",
    "Natural Language :: English",
    "Natural Language :: Japanese",
    "Natural Language :: Korean",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Text Processing :: Indexing",
    "Topic :: Text Processing :: Markup :: Markdown",
    "Topic :: Utilities",
]
dependencies = [
    # lint (fix-plan schema), port (bundle schema)
    "jsonschema>=4.26.0",
    # highlight
    "pypdf>=7.0.1",
    # port (Dify / RAGFlow public APIs)
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# `ragwrench sync`, `ragwrench bm25`, and Qdrant-backed knowledge in `ragwrench dify-bridge`.
qdrant = ["qdrant-client>=1.20.0,<2"]
# `ragwrench migrate` (Chroma <-> Qdrant). chromadb does not support Python 3.14 yet.
chroma = [
    "chromadb>=1.5.9; python_version < '3.14'",
    "qdrant-client>=1.20.0,<2",
]
# `ragwrench bm25 --tokenizer jieba`
jieba = ["jieba>=0.42.1"]
# `ragwrench.tablechunk.tiktoken_counter` (may download its vocabulary on first use)
tiktoken = ["tiktoken>=0.12.0"]
# Every optional backend the test suite exercises (chromadb is skipped on Python 3.14).
# tiktoken is left out because it may download its vocabulary on first use.
all = ["ragwrench[qdrant,chroma,jieba]"]
# Test runner. pypdf, httpx and jsonschema, which the tests import directly, are core
# dependencies. Suites for optional backends (qdrant_client, chromadb) are skipped at
# collection when the backend is missing (see tests/conftest.py): install `.[all,test]`
# to run everything.
test = ["pytest>=9.0.2"]

[project.urls]
Homepage = "https://github.com/tianhaogutum/ragwrench"
Repository = "https://github.com/tianhaogutum/ragwrench"
Issues = "https://github.com/tianhaogutum/ragwrench/issues"
Documentation = "https://github.com/tianhaogutum/ragwrench/blob/main/docs/README.md"

[project.scripts]
ragwrench = "ragwrench.cli:main"

# PyPI cannot resolve repository-relative links or images: rewrite them to GitHub URLs.
[tool.hatch.metadata.hooks.fancy-pypi-readme]
content-type = "text/markdown"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.fragments]]
path = "README.md"

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# <img src>, <source srcset>: raw file URLs so the images render
pattern = '(src|srcset)="(?!https?://)([^"]+)"'
replacement = '\1="https://raw.githubusercontent.com/tianhaogutum/ragwrench/main/\2"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = 'href="(?!https?://|#|mailto:)([^"]+)"'
replacement = 'href="https://github.com/tianhaogutum/ragwrench/blob/main/\1"'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# Markdown images, then Markdown links to files and directories
pattern = '!\[([^\]]*)\]\((?!https?://)([^)\s]+)\)'
replacement = '![\1](https://raw.githubusercontent.com/tianhaogutum/ragwrench/main/\2)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
pattern = '\]\((?!https?://|#|mailto:)([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/ragwrench/blob/main/\1)'

[[tool.hatch.metadata.hooks.fancy-pypi-readme.substitutions]]
# In-page anchors: PyPI does not generate heading ids
pattern = '\]\(#([^)\s]+)\)'
replacement = '](https://github.com/tianhaogutum/ragwrench#\1)'

[tool.hatch.build.targets.wheel]
# Runtime data files inside the package are shipped with it: lint/data/*, lint/schemas/*.json,
# port/bundle.schema.json, bm25/data/*, citecheck/data/benchmark.jsonl.
packages = ["src/ragwrench"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/benchmarks",
    "/licenses",
    "/README.md",
    "/LICENSE",
    "/THIRD_PARTY.md",
    "/pyproject.toml",
]
exclude = [
    "__pycache__",
    "*.py[cod]",
    ".cache",
    ".artifacts",
    ".pytest_cache",
    ".ruff_cache",
    ".qdrant",
    ".kbport",
    ".DS_Store",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-ra"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
# Correctness-focused set; the merged tools keep their original compact style.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.lint.per-file-ignores]
# Test modules re-export fixtures and helpers across sibling modules and keep a compact style.
"tests/**" = ["F401", "F811", "F841", "E402", "E701", "E702", "E731"]
# Demo scripts keep the original tools' compact one-line style.
"examples/**" = ["F841", "E701", "E702"]
