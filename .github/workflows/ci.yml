name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      # Rules and per-file ignores live in [tool.ruff] in pyproject.toml.
      - run: uvx ruff check .

  test:
    name: test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Poppler for the rendered PDF highlight test
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends poppler-utils
      - name: Install
        # chromadb does not support Python 3.14 yet: the chroma extra skips it there
        # (python_version marker) and tests/conftest.py leaves out the migrate suite.
        run: python -m pip install -e ".[all,test]"
      - name: Run tests
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install build twine
          python -m build
      - name: Check distribution metadata and PyPI README
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/python -m pip install dist/*.whl
          cd /tmp
          /tmp/wheel-env/bin/ragwrench --version
          /tmp/wheel-env/bin/ragwrench --help
          /tmp/wheel-env/bin/ragwrench eval run --help
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
